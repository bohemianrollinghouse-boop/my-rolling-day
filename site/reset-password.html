<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réinitialiser mon mot de passe — My Rolling Day</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="card-shell">
    <div class="card">
      <a class="brand" href="./index.html">
        <svg class="brand-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="7" fill="#B85F4A"></rect>
          <circle cx="16" cy="16" r="9.5" fill="none" stroke="#FDFBF7" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.4 2.8" opacity="0.65"></circle>
          <circle cx="16" cy="16" r="6" fill="none" stroke="#FDFBF7" stroke-width="1.8" stroke-linecap="round"></circle>
          <circle cx="16" cy="6.5" r="1.9" fill="#FDFBF7"></circle>
        </svg>
        <span class="brand-word">my <em>rolling</em> day</span>
      </a>

      <div id="app">
        <h1>Vérification du lien…</h1>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6B4xw8I507Zb7ZkLAmkUbCPTsnKVBjTE",
      authDomain: "my-rolling-day.firebaseapp.com",
      projectId: "my-rolling-day",
      storageBucket: "my-rolling-day.firebasestorage.app",
      messagingSenderId: "543367828677",
      appId: "1:543367828677:web:6ff53808141b506ca30cac",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const appEl = document.getElementById("app");

    function formatError(error) {
      const code = error?.code || "";
      if (code === "auth/expired-action-code") return "Ce lien a expiré. Redemande une réinitialisation depuis l'application.";
      if (code === "auth/invalid-action-code") return "Ce lien n'est plus valide. Redemande une réinitialisation depuis l'application.";
      if (code === "auth/weak-password") return "Le nouveau mot de passe est trop faible.";
      if (code === "auth/network-request-failed") return "Erreur réseau. Vérifie ta connexion Internet.";
      return error?.message || "Erreur inconnue.";
    }

    function renderVerifying() {
      appEl.innerHTML = `<h1>Vérification du lien…</h1>`;
    }

    function renderInvalid(message) {
      appEl.innerHTML = `
        <h1>Lien invalide</h1>
        <div class="error-box">${message}</div>
        <p class="sub" style="margin-top:16px">Redemande un e-mail de réinitialisation depuis l'écran de connexion de l'application.</p>
        <a class="back-link" href="./index.html">← Retour au site</a>
      `;
    }

    function renderDone() {
      appEl.innerHTML = `
        <div class="ok-icon">✓</div>
        <h1>Mot de passe modifié</h1>
        <p class="sub">Tu peux maintenant retourner dans l'application My Rolling Day et te connecter avec ton nouveau mot de passe.</p>
        <a class="btn btn-primary" href="https://my-rolling-day.web.app" style="margin-top:8px">Retourner à l'application</a>
      `;
    }

    function renderForm(email) {
      appEl.innerHTML = `
        <h1>Choisis un nouveau mot de passe</h1>
        <p class="sub">${email}</p>
        <form id="reset-form">
          <input class="field" type="password" id="password" placeholder="Nouveau mot de passe" autocomplete="new-password" />
          <input class="field" type="password" id="confirmPassword" placeholder="Confirme le mot de passe" autocomplete="new-password" />
          <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%">Valider le nouveau mot de passe</button>
        </form>
        <div id="error-slot"></div>
      `;

      const form = document.getElementById("reset-form");
      const submitBtn = document.getElementById("submit-btn");
      const errorSlot = document.getElementById("error-slot");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorSlot.innerHTML = "";
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (String(password || "").length < 6) {
          errorSlot.innerHTML = `<div class="error-box">Le mot de passe doit contenir au moins 6 caractères.</div>`;
          return;
        }
        if (password !== confirmPassword) {
          errorSlot.innerHTML = `<div class="error-box">Les deux mots de passe ne correspondent pas.</div>`;
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Validation...";
        try {
          await confirmPasswordReset(auth, oobCode, password);
          renderDone();
        } catch (error) {
          errorSlot.innerHTML = `<div class="error-box">${formatError(error)}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Valider le nouveau mot de passe";
        }
      });
    }

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");

    renderVerifying();

    if (!oobCode) {
      renderInvalid("Lien de réinitialisation invalide.");
    } else {
      verifyPasswordResetCode(auth, oobCode)
        .then((email) => renderForm(email || ""))
        .catch((error) => renderInvalid(formatError(error)));
    }
  </script>
</body>
</html>
